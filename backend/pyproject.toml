[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrovoice"
version = "0.1.0"
description = "Backend + ingestion worker for the MacroVoice voice food-logging app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["macrovoice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises several components together (real SQLite, HTTP via fakes)"]
